[package]
name = "obsidia"
version = "0.4.2"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Obsidia: launcher de Minecraft ligero"

# Tauri exige su propio workspace; la lógica vive en ../crates/obsidia-core.
[workspace]

[lib]
name = "obsidia_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
obsidia-core = { path = "../crates/obsidia-core" }
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
base64 = "0.22"
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Obsidia</title>
    <!-- Pantalla de arranque estática: se pinta al instante, antes de que
         cargue el JavaScript, para que ninguna ventana se vea en negro. -->
    <style>
      html, body { margin: 0; height: 100%; background: #09080d; }
      #boot {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        background:
          radial-gradient(420px 260px at 50% 40%, rgba(160, 107, 255, 0.2), transparent 70%),
          linear-gradient(170deg, #110d1a 0%, #09080d 60%, #060509 100%);
        color: #eeecf6; font: 700 24px/1 system-ui, sans-serif; letter-spacing: 0.32em;
      }
      #boot svg { width: 66px; height: 75px; filter: drop-shadow(0 12px 24px rgba(160, 107, 255, 0.35)); }
      #boot span { margin-right: -0.32em; }
      #boot b { display: block; width: 160px; height: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
      #boot b::after { content: ""; display: block; width: 40%; height: 100%; background: #a06bff; animation: boot 1s ease-in-out infinite alternate; }
      @keyframes boot { to { transform: translateX(150%); } }
      @media (prefers-reduced-motion: reduce) { #boot b::after { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="boot" aria-label="Cargando Obsidia">
        <svg viewBox="220 180 584 664" aria-hidden="true">
          <polygon points="512,196 786,354 512,512 238,354" fill="#5a3a9e" />
          <polygon points="238,354 512,512 512,828 238,670" fill="#1b1230" />
          <polygon points="512,512 786,354 786,670 512,828" fill="#2c1b4c" />
          <polygon points="512,268 660,354 512,440 364,354" fill="#9a74e6" opacity="0.55" />
          <path d="M300 430 L344 455 L344 505 L388 530 L388 600 L432 625" fill="none" stroke="#b993ff" stroke-width="26" stroke-linecap="square" />
          <path d="M556 700 L600 675 L600 625 L644 600 L644 545 L688 520 L688 470 L736 443" fill="none" stroke="#a06bff" stroke-width="26" stroke-linecap="square" />
          <polygon points="512,196 786,354 786,670 512,828 238,670 238,354" fill="none" stroke="#d9c2ff" stroke-opacity="0.35" stroke-width="10" stroke-linejoin="round" />
        </svg>
        <span>OBSIDIA</span>
        <b></b>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

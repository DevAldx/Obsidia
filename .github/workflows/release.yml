name: Release

# Publica una versión al empujar una etiqueta vX.Y.Z (debe coincidir con la
# versión de src-tauri/tauri.conf.json). Compila y firma el AppImage de Linux
# y el instalador NSIS de Windows, genera latest.json para el actualizador y
# crea la release de GitHub con las notas de PATCH_NOTES_<versión>.md.
#
# Requiere el secreto TAURI_SIGNING_PRIVATE_KEY (contenido de la clave
# minisign sin contraseña):
#   gh secret set TAURI_SIGNING_PRIVATE_KEY < ~/.tauri/obsidia.key

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Etiqueta a publicar (p. ej. v0.4.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  check:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Comprobar versión y secreto
        id: v
        run: |
          VERSION=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -1)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::La etiqueta $TAG no coincide con la versión $VERSION de tauri.conf.json"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Falta el secreto TAURI_SIGNING_PRIVATE_KEY"
            exit 1
          fi
          test -f "PATCH_NOTES_$VERSION.md" || { echo "::error::Falta PATCH_NOTES_$VERSION.md"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  linux:
    needs: check
    runs-on: ubuntu-22.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libdbus-1-dev libssl-dev patchelf libfuse2 file
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Compilar y firmar el AppImage
        run: ./scripts/build-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
          if-no-files-found: error

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Compilar y firmar el instalador NSIS
        run: npm run tauri build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          if-no-files-found: error

  publish:
    needs: [check, linux, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: src-tauri/target/ci/bundle
      - name: Generar latest.json
        env:
          GITHUB_REPO: ${{ github.repository }}
          NOTES: "Obsidia ${{ needs.check.outputs.version }}: consulta las novedades en GitHub."
        run: ./create_latest_json.sh
      - name: Crear la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$TAG" \
            --title "Obsidia v$VERSION" \
            --notes-file "PATCH_NOTES_$VERSION.md" \
            --latest \
            latest.json \
            src-tauri/target/ci/bundle/linux/* \
            src-tauri/target/ci/bundle/windows/*

[package]
name = "obsidia-installer"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
description = "Instalador de Obsidia para Linux"

[workspace]

[lib]
name = "obsidia_installer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
minisign-verify = "0.3"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
